name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  build:
    name: Linux x86_64 release
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential pkg-config libgtk-4-dev libadwaita-1-dev
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: ubuntu-24.04
      - name: Validate tag and extract changelog
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cargo run --locked --no-default-features --example release_notes -- \
            "$RELEASE_TAG" release-notes.md
          printf 'version=%s\n' "${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Build
        run: cargo build --locked --release --bin efuseek
      - name: Package and checksum
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: bash scripts/package-release.sh "$RELEASE_VERSION"
      - name: Upload release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-bundle
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
            release-notes.md
          if-no-files-found: error
          retention-days: 7

  publish:
    name: GitHub Release from CHANGELOG
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-bundle
          path: release
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            flags+=(--prerelease)
          else
            flags+=(--latest)
          fi
          gh release create "$RELEASE_TAG" \
            release/dist/*.tar.gz release/dist/SHA256SUMS \
            --verify-tag --title "EfuSeek $RELEASE_TAG" \
            --notes-file release/release-notes.md "${flags[@]}"
