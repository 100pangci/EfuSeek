[package]
name = "efuseek"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "A native Linux desktop search tool for Everything EFU file lists"
repository = "https://github.com/100pangci/EfuSeek"
readme = "README.md"

[dependencies]
anyhow = "1"
csv = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
rusqlite = { version = "0.37", features = ["bundled", "hooks", "functions"] }
gtk = { package = "gtk4", version = "0.10", features = ["v4_12"], optional = true }
adw = { package = "libadwaita", version = "0.8", features = ["v1_4"], optional = true }
log = "0.4"
env_logger = "0.11"
chrono = "0.4"
gio = "0.21"

[features]
default = ["gui"]
gui = ["dep:gtk", "dep:adw"]

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "efuseek"
required-features = ["gui"]

[profile.release]
strip = true
